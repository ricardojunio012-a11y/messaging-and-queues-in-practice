# Chapter 5: idempotency and deduplication with RabbitMQ and PostgreSQL
#
# The behavior of the producer and the consumer is chosen in the .env file.
# After changing .env, run `docker compose up -d --build` again.
# No port is published on your machine.

name: messaging-ch05

x-service: &service
  build: ./node
  image: pedido-certo/ch05-node
  init: true
  depends_on:
    rabbitmq:
      condition: service_healthy
    postgres:
      condition: service_healthy

x-env: &env
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  DATABASE_URL: postgresql://pedidocerto:pedidocerto@postgres:5432/pedidocerto

services:
  rabbitmq:
    image: rabbitmq:4.3.7-management
    hostname: rabbitmq
    healthcheck:
      # Tests the AMQP port (see the comment in the chapter 3 lab)
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/5672"]
      interval: 3s
      retries: 30

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pedidocerto
      POSTGRES_PASSWORD: pedidocerto
      POSTGRES_DB: pedidocerto
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "pedidocerto"]
      interval: 2s
      retries: 20

  # Producer: writes the order and publishes SendConfirmationEmail
  orders-api:
    <<: *service
    environment:
      <<: *env
      SERVICE: orders-api
      PORT: 8080
      DUPLICATE_PUBLISH: ${DUPLICATE_PUBLISH:-no}

  # Consumer: records the history and "sends" the email through the provider
  notifications:
    <<: *service
    restart: on-failure
    volumes:
      - counter:/counter
    environment:
      <<: *env
      SERVICE: notifications
      IDEMPOTENCY: ${IDEMPOTENCY:-none}
      FAIL_ON_MESSAGE: ${FAIL_ON_MESSAGE:-0}
      LATENCY_MS: ${LATENCY_MS:-100}

  # Lab tool: `docker compose run --rm load`
  load:
    build: ./load
    image: pedido-certo/ch05-load
    profiles: ["tools"]
    volumes:
      - counter:/counter
    environment:
      N: ${N:-20}
      C: ${C:-5}
      PGHOST: postgres
      PGUSER: pedidocerto
      PGPASSWORD: pedidocerto
      PGDATABASE: pedidocerto

volumes:
  counter:
