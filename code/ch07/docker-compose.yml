# Chapter 7: ack, retry, backoff and DLQ with RabbitMQ
#
# The behavior of the consumer is chosen in the .env file.
# After changing .env, run `docker compose up -d --build` again.
# No port is published on your machine.

name: messaging-ch07

x-environment: &environment
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  DATABASE_URL: postgresql://pedidocerto:pedidocerto@postgres:5432/pedidocerto

services:
  rabbitmq:
    image: rabbitmq:4.3.7-management
    hostname: rabbitmq
    healthcheck:
      # Tests the AMQP port (see the comment in the chapter 3 lab)
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/5672"]
      interval: 3s
      retries: 30

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pedidocerto
      POSTGRES_PASSWORD: pedidocerto
      POSTGRES_DB: pedidocerto
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "pedidocerto"]
      interval: 2s
      retries: 20

  # Consumer: issues the invoice for each order by calling the simulated SEFAZ
  invoice:
    build: ./node
    image: pedido-certo/ch07-node
    init: true
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *environment
      SERVICE: invoice
      RETRY_MODE: ${RETRY_MODE:-immediate}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      FAILURE_RATE: ${FAILURE_RATE:-0.3}
      ACCEPT_TOTAL_AS_TEXT: ${ACCEPT_TOTAL_AS_TEXT:-no}
      LATENCY_MS: ${LATENCY_MS:-50}

  # Lab tool: `docker compose run --rm load`
  load:
    build: ./load
    image: pedido-certo/ch07-load
    profiles: ["tools"]
    environment:
      N: ${N:-20}
      REDRIVE_PER_SECOND: ${REDRIVE_PER_SECOND:-5}
      PGHOST: postgres
      PGUSER: pedidocerto
      PGPASSWORD: pedidocerto
      PGDATABASE: pedidocerto
