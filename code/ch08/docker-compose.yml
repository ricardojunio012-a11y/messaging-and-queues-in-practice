# Chapter 8: retention, replay and reprocessing with Kafka
#
# The behavior of the consumer is chosen in the .env file.
# After changing .env, run `docker compose up -d --build` again.
# No port is published on your machine.

name: messaging-ch08

services:
  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The compactor checks the topics every 5 s (the default is 15 s)
      KAFKA_LOG_CLEANER_BACKOFF_MS: 5000
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      retries: 30

  # Creates the topics and exits:
  #  - paid-orders: the payment events, retained for 30 days
  #  - customer-balance: compacted, keeps only the latest balance of each customer
  #    (10 s segments so that compaction shows up during the lab)
  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic paid-orders --partitions 3 --replication-factor 1 \
          --config retention.ms=2592000000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic customer-balance --partitions 1 --replication-factor 1 \
          --config cleanup.policy=compact --config segment.ms=10000 \
          --config min.cleanable.dirty.ratio=0.01

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pedidocerto
      POSTGRES_PASSWORD: pedidocerto
      POSTGRES_DB: pedidocerto
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "pedidocerto"]
      interval: 2s
      retries: 20

  # Consumer: computes the loyalty points of each paid order
  loyalty:
    build: ./node
    image: pedido-certo/ch08-node
    init: true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      SERVICE: loyalty
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgresql://pedidocerto:pedidocerto@postgres:5432/pedidocerto
      POINTS_RULE: ${POINTS_RULE:-1}

  # Lab tool: `docker compose run --rm tools <command>`
  tools:
    build: ./tools
    image: pedido-certo/ch08-tools
    profiles: ["tools"]
    environment:
      PGHOST: postgres
      PGUSER: pedidocerto
      PGPASSWORD: pedidocerto
      PGDATABASE: pedidocerto
