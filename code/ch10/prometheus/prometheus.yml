# Collects RabbitMQ's per-queue metrics every 5 s and evaluates the alert rules
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rabbitmq
    # The "detailed" endpoint has per-queue metrics; "family" chooses which groups
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]
