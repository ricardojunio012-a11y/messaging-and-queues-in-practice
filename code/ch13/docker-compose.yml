# Chapter 13: Change Data Capture with PostgreSQL, Debezium and Kafka
#
# After changing .env, run `docker compose up -d --build` again.
# No port is published on your machine.

name: messaging-ch13

x-service: &service
  build: ./node
  image: pedido-certo/ch13-node
  init: true
  depends_on:
    kafka:
      condition: service_healthy
    postgres:
      condition: service_healthy

x-environment: &environment
  KAFKA_BROKERS: kafka:9092
  DATABASE_URL: postgresql://pedidocerto:pedidocerto@postgres:5432/pedidocerto

services:
  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      retries: 30

  # Creates the order events topic and exits
  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create
      --if-not-exists --topic outbox.event.order --partitions 3 --replication-factor 1

  # wal_level=logical turns on logical decoding, which Debezium uses to read the WAL.
  # pg_stat_statements counts the queries of each user (step 5 of the lab).
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "wal_level=logical",
              "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: pedidocerto
      POSTGRES_PASSWORD: pedidocerto
      POSTGRES_DB: pedidocerto
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "pedidocerto"]
      interval: 2s
      retries: 20

  # Kafka Connect with the Debezium connectors. The connectors are created by the
  # tool, through the Connect REST API (port 8083, only inside the Docker network).
  connect:
    image: quay.io/debezium/connect:3.6.2.Final
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect-pedidocerto
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Debezium only confirms to the database what it has read when Connect writes
      # the offsets (60 s by default). With 5 s, the slot releases the WAL sooner.
      OFFSET_FLUSH_INTERVAL_MS: 5000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/connectors"]
      interval: 5s
      retries: 40

  # Writes the order and the event to the outbox, in the same transaction (chapter 12)
  orders-api:
    <<: *service
    environment:
      <<: *environment
      SERVICE: orders-api
      PORT: 8080

  # Consumer: sends the email for each order, with an inbox (chapter 5)
  notifications:
    <<: *service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      <<: *environment
      SERVICE: notifications

  # The polling relay of chapter 12, now publishing to Kafka. It only starts in step 5:
  # `docker compose --profile polling up -d relay`
  relay:
    <<: *service
    profiles: ["polling"]
    environment:
      <<: *environment
      SERVICE: relay
      DATABASE_URL: postgresql://relay:relay@postgres:5432/pedidocerto

  # Lab tool: `docker compose run --rm tools <command>`
  tools:
    build: ./tools
    image: pedido-certo/ch13-tools
    profiles: ["tools"]
    # No depends_on: the tool must work with Connect stopped (step 2)
    environment:
      N: ${N:-100}
      PGHOST: postgres
      PGUSER: pedidocerto
      PGPASSWORD: pedidocerto
      PGDATABASE: pedidocerto
