# Chapter 21: orders per minute and per region, in three ways: a hand-made window
# in TypeScript, Kafka Streams and Flink SQL
#
# No port is published on your machine.

name: messaging-ch21

services:
  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      retries: 30

  # Creates the topics (one partition each, so the order is clear) and exits
  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - for t in orders windows-manual windows-kafka-streams windows-flink; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create
          --if-not-exists --topic $$t --partitions 1 --replication-factor 1; done

  # The hand-made window, in TypeScript
  windows:
    build: ./node
    image: pedido-certo/ch21-node
    init: true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      SERVICE: windows
      KAFKA_BROKERS: kafka:9092
      TOLERANCE_MS: ${TOLERANCE_MS:-30000}

  # The same count with Kafka Streams (Java)
  kafka-streams:
    build: ./kafka-streams
    image: pedido-certo/ch21-kafka-streams
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      TOLERANCE_MS: ${TOLERANCE_MS:-30000}

  # The same count with Flink SQL: one JobManager, one TaskManager and the SQL client
  flink-jobmanager:
    build: ./flink
    image: pedido-certo/ch21-flink
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
  flink-taskmanager:
    image: pedido-certo/ch21-flink
    command: taskmanager
    depends_on: [flink-jobmanager]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1280m
        taskmanager.numberOfTaskSlots: 2
  # Sends the SQL job to the cluster and exits: `docker compose run --rm flink-sql`
  flink-sql:
    image: pedido-certo/ch21-flink
    profiles: ["tools"]
    depends_on: [flink-jobmanager]
    command: ["bin/sql-client.sh", "-f", "/opt/flink/windows.sql"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager

  # Lab tool: `docker compose run --rm tools <command>`
  tools:
    build: ./tools
    image: pedido-certo/ch21-tools
    profiles: ["tools"]
    environment:
      KAFKA_BROKERS: kafka:9092
