# Kiosk server: its own JetStream, with the "kiosk" domain, to keep the orders even
# without internet; it connects to the cloud as a leaf node when the network exists
port: 4222
http_port: 8222
jetstream { store_dir: "/data", domain: "kiosk" }
leafnodes { remotes: [ { url: "nats-leaf://nats:7422" } ] }
