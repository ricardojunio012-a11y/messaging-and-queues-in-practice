# Chapter 23: security. RabbitMQ with TLS only and one user per service; Kafka with
# SASL/SCRAM, ACLs and a quota.
#
# No port is published on your machine.

name: messaging-ch23

services:
  # Generates the lab CA and the RabbitMQ certificate in the certs volume, and exits
  certs:
    build: ./certs
    image: pedido-certo/ch23-certs
    volumes:
      - certs:/certs

  rabbitmq:
    image: rabbitmq:4.3.7-management
    depends_on:
      certs:
        condition: service_completed_successfully
    volumes:
      - certs:/certs:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      # Tests the TLS port. Avoid "rabbitmq-diagnostics" here (see chapter 3): it
      # creates .erlang.cookie with the wrong owner and RabbitMQ does not start.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/5671"]
      interval: 5s
      retries: 30

  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # CLIENTS: SASL/SCRAM for the services. INTERNAL: no authentication, but only on
      # 127.0.0.1, inside the container, to set up users and ACLs.
      KAFKA_LISTENERS: CLIENTS://:9092,INTERNAL://127.0.0.1:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: CLIENTS://kafka:9092,INTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,CLIENTS:SASL_PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_LISTENER_NAME_CLIENTS_SCRAM___SHA___512_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.scram.ScramLoginModule required;
      # Without an ACL, nobody accesses anything; the anonymous user is the one on the
      # internal listener
      KAFKA_AUTHORIZER_CLASS_NAME: >-
        org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:ANONYMOUS
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh",
             "--bootstrap-server", "127.0.0.1:9094"]
      interval: 5s
      retries: 30

  # Creates users, topics, ACLs and the quota through the internal listener: it shares
  # the network of the Kafka container to reach 127.0.0.1:9094
  kafka-init:
    image: apache/kafka:4.3.2
    network_mode: service:kafka
    depends_on:
      kafka:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./kafka/setup.sh:/setup.sh:ro
    entrypoint: ["bash", "/setup.sh"]

  # The clients: `docker compose run --rm rabbit <command> <user>` and
  # `docker compose run --rm kafka-client <command> <user> <topic>`
  rabbit:
    build: ./node
    image: pedido-certo/ch23-node
    profiles: ["tools"]
    env_file: .env
    environment:
      SERVICE: rabbit
    volumes:
      - certs:/certs:ro
  kafka-client:
    image: pedido-certo/ch23-node
    profiles: ["tools"]
    env_file: .env
    environment:
      SERVICE: kafka

volumes:
  certs:
